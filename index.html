<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>Recomp</title>
<style>
  /* Type scale: 28 / 20 / 17 / 13. Weights: 400 / 600. Spacing on a 4/8 grid. */
  :root {
    --bg: #f2f2f7; --card: #fff; --fill: rgba(118,118,128,.12); --line: rgba(60,60,67,.16);
    --ink: #000; --ink2: rgba(60,60,67,.62); --bar: rgba(242,242,247,.86);
    --accent: #d63d20; --accent-text: #d63d20; --accent-soft: rgba(214,61,32,.08);
    --warn: #a15c00; --warn-soft: rgba(255,159,10,.14);
    --good: #248a3d; --good-text: #248a3d; --good-soft: rgba(52,199,89,.16);
    --shadow: 0 1px 2px rgba(60,40,30,.04), 0 8px 24px rgba(60,40,30,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --fill: rgba(118,118,128,.24); --line: rgba(84,84,88,.6);
            --ink: #fff; --ink2: rgba(235,235,245,.6); --bar: rgba(18,18,20,.86);
            --accent-text: #ff7a5c; --accent-soft: rgba(255,122,92,.14); --warn: #ffb340; --warn-soft: rgba(255,159,10,.16); --good-text: #30d158; --good-soft: rgba(48,209,88,.2); --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom) + 168px); }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.4px; margin: 0 0 24px; }
  h2 { font-size: 20px; font-weight: 600; letter-spacing: -.2px; margin: 0; }
  h3 { font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: .4px; color: var(--ink2); margin: 32px 16px 8px; }
  p { margin: 0; }
  .sub { font-size: 13px; color: var(--ink2); }
  .grow { flex: 1; min-width: 0; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { flex: none; }

  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); }
  .pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-text); }
  .primary { display: block; width: 100%; min-height: 52px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600;
             box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 20px rgba(214,61,32,.24); transition: transform .12s; }
  .primary:active { transform: scale(.98); }
  .link { color: var(--accent-text); min-height: 44px; padding: 0 4px; }
  .danger { color: #ff3b30; }

  /* Home */
  .top { padding-top: calc(env(safe-area-inset-top) + 24px); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; }
  .tile { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .tile b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -.4px; }
  .tile b small { font-size: 17px; font-weight: 400; color: var(--ink2); }
  .tile span { font-size: 13px; color: var(--ink2); }
  .plain { list-style: none; margin: 0; padding: 0; }
  .plain li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .plain li:first-child { border-top: 0; }

  /* Calendar */
  .cal { padding: 16px; }
  .cal-head { display: flex; align-items: center; padding-left: 8px; margin-bottom: 4px; }
  .cal-head h2 { flex: 1; }
  .icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--accent-text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .wd { font-size: 13px; color: var(--ink2); padding: 4px 0 8px; }
  .cal-d { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 48px; }
  .cal-d .num { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; transition: background .15s; }
  .cal-d.past:not(.did) .num { color: var(--ink2); }
  .cal-d.today .num { color: var(--accent-text); font-weight: 600; }
  .cal-d.sel .num { background: var(--ink); color: var(--card); font-weight: 600; }
  .cal-d.today.sel .num { background: var(--accent); color: #fff; }
  .cal-d i { width: 6px; height: 6px; border-radius: 50%; }
  .cal-d.did i { background: var(--hue); }
  .cal-d.planned i { box-shadow: inset 0 0 0 1.5px var(--hue); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .sw { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--hue); }
  .legend .sw { width: 8px; height: 8px; }
  .legend .sw.ring { background: none; box-shadow: inset 0 0 0 1.5px var(--ink2); }
  .day-title { margin: 32px 4px 0; }
  .opt .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .group + .group { margin-top: 12px; }
  .wk-head { display: flex; justify-content: space-between; }
  .wk-head .goal { color: var(--good-text); }
  .warn { display: flex; gap: 12px; padding: 16px; border-radius: 16px; background: var(--warn-soft); color: var(--warn); }
  .warn b { font-weight: 600; }
  .warn p { margin-top: 4px; font-size: 13px; color: var(--ink2); }
  .reminder { margin-top: 12px; }
  .reminder svg { color: var(--ink2); }
  .reminder .due { font-weight: 600; color: var(--accent-text); }
  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 16px; }
  .secondary { min-height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .check { display: block; width: 100%; padding: 8px; }
  .pair, .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair img, .cmp img, .ph { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--fill); }
  .ph { display: grid; place-content: center; justify-items: center; gap: 8px; padding: 8px; font-size: 13px; color: var(--ink2); text-align: center; }
  .ph.add { border: 2px dashed var(--line); color: var(--accent-text); font-weight: 600; }
  .slot { position: relative; display: block; width: 100%; }
  .slot .cap { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; }
  .back { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
  input[type=date] { display: block; width: 100%; height: 44px; padding: 0 12px; font: inherit; border: 0; border-radius: 10px; background: var(--card); color: var(--ink); -webkit-appearance: none; }
  .seg { display: flex; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg button { flex: 1; min-height: 40px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .cmp { margin-top: 16px; }
  .cmp select { display: block; width: 100%; height: 44px; margin-bottom: 8px; font: inherit; font-weight: 600; text-align: center; text-align-last: center;
                border: 0; border-radius: 10px; background: var(--card); color: var(--ink); -webkit-appearance: none; }
  .li .num { flex: none; width: 72px; }
  .li .unit { width: 32px; margin-left: -4px; }
  .li .seg { flex: none; width: 168px; }
  .pill.good { background: var(--good-soft); color: var(--good-text); }

  /* iOS grouped list */
  .group { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .li { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 16px; text-align: left; }
  .group > * + * { border-top: 1px solid var(--line); }
  .li .chev { color: var(--ink2); transition: transform .2s; }
  details[open] .chev { transform: rotate(90deg); }
  summary { list-style: none; } summary::-webkit-details-marker { display: none; }
  .body { padding: 0 16px 12px; }
  details .body li { font-size: 15px; }
  .note { padding: 8px 16px 0; font-size: 13px; color: var(--ink2); }
  .rules { margin: 0; padding: 0 16px 16px 32px; color: var(--ink2); }
  .rules li { margin: 8px 0; font-size: 15px; }
  .empty { text-align: center; padding: 32px 24px; }
  .empty p + p { margin-top: 4px; }

  /* Workout */
  .nav { position: sticky; top: 0; z-index: 5; margin: 0 -16px 16px; padding: calc(env(safe-area-inset-top) + 4px) 16px 0;
         background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .nav .row { display: flex; align-items: center; justify-content: space-between; }
  .nav .title { font-weight: 600; }
  .nav .count { min-width: 64px; text-align: right; font-size: 13px; color: var(--ink2); }
  .progress { height: 4px; margin: 4px -16px 0; background: var(--fill); }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

  .ex-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; margin-bottom: 8px;
            background: var(--card); border-radius: 16px; text-align: left; box-shadow: var(--shadow); }
  .ex-row .sub { text-align: right; }
  .dot { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); color: #fff; }
  .ex-row.ok .dot { background: var(--good); border-color: var(--good); }
  .ex-row.ok .grow { color: var(--ink2); }

  .ex-open { margin-bottom: 8px; scroll-margin-top: calc(env(safe-area-inset-top) + 72px); }
  .ex-open.enter { animation: in .25s ease-out; }
  .ex-open .meta { margin-top: 4px; }
  .ex-open .cue { margin-top: 8px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .stats div { background: var(--fill); border-radius: 12px; padding: 8px 12px; }
  .stats b { display: block; font-weight: 600; }
  .tip { display: flex; gap: 8px; margin-top: 8px; padding: 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); font-size: 13px; font-weight: 600; }
  .sets { margin-top: 16px; }
  .set, .sets .head { display: grid; grid-template-columns: 24px 1fr 1fr 44px; gap: 8px; align-items: center; }
  .sets .head { font-size: 13px; color: var(--ink2); text-align: center; padding-bottom: 4px; }
  .set { margin: 0 -8px; padding: 4px 8px; border-radius: 12px; transition: background .2s; }
  .set .n { font-size: 13px; color: var(--ink2); text-align: center; }
  .set.done { background: var(--good-soft); }
  input[type=number], input.num { width: 100%; height: 44px; font: inherit; font-weight: 600; text-align: center; border: 0; border-radius: 10px;
                       background: var(--fill); color: var(--ink); -moz-appearance: textfield; }
  input::placeholder { color: var(--ink2); font-weight: 400; opacity: .8; }
  input:focus { outline: 2px solid var(--accent-text); outline-offset: -2px; }
  .set.done input { background: transparent; }
  .tick { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); color: var(--ink2); }
  .tick svg { opacity: .35; }
  .set.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
  .set.pop .tick { animation: pop .3s; }
  .set.done .tick svg { opacity: 1; }
  .shake { animation: shake .35s; }

  /* Bottom dock: rest timer + primary action, in the thumb zone */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
          background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid var(--line); }
  #dock > * { max-width: 528px; margin: 0 auto; }
  #dock:has(#tabs:not([hidden])) { padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom) + 4px); }
  #tabs { display: flex; }
  #tabs[hidden] { display: none; }
  #tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 13px; color: var(--ink2); }
  #tabs button[aria-current=page] { color: var(--accent-text); font-weight: 600; }
  .hero { border-top: 4px solid var(--hue); }
  .hero h2 { margin-top: 12px; }
  .hero .plain { margin: 16px 0 24px; }
  #timer { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 8px 8px 8px 16px;
           border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
  #timer[hidden] { display: none; }
  #tfill { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); transition: width .25s linear; }
  #timer > :not(#tfill) { position: relative; }
  #ttime { font-size: 20px; font-weight: 600; min-width: 56px; }
  #timer button { min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--fill); font-size: 13px; font-weight: 600; }
  #timer.over { background: var(--good); color: #fff; }
  #timer.over #tfill { display: none; }

  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); z-index: 20; transform: translate(-50%, -16px); opacity: 0;
           padding: 12px 16px; border-radius: 99px; background: rgba(30,30,30,.92); color: #fff; font-size: 13px; font-weight: 600;
           pointer-events: none; transition: .25s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Finish screen */
  .finish { text-align: center; padding-top: calc(env(safe-area-inset-top) + 64px); }
  .badge { display: grid; place-items: center; width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 50%; background: var(--good); color: #fff;
           box-shadow: 0 0 0 12px var(--good-soft), 0 16px 40px rgba(36,138,61,.3); animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  .finish h1 { margin-bottom: 4px; }
  .finish .tiles { margin-top: 32px; text-align: left; grid-template-columns: 1fr 1fr; }
  .finish .group { text-align: left; }
  .finish .li b { font-weight: 600; }
  .cheer { margin-top: 32px; color: var(--ink2); }

  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="dock">
  <div id="timer" hidden role="timer" aria-live="polite">
    <i id="tfill"></i><span id="tlabel" class="grow">Rest</span><b id="ttime"></b>
    <button onclick="addRest(30)">+30s</button><button onclick="skipRest()">Skip</button>
  </div>
  <div id="cta"></div>
  <nav id="tabs" hidden>
    <button data-tab="home" onclick="setTab('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="calendar" onclick="setTab('calendar')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-tab="progress" onclick="setTab('progress')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5a2 2 0 0 1 2-2h2.5L9 4.5h6l1.5 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Progress</button>
    <button data-tab="settings" onclick="setTab('settings')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden onchange="pickedPhoto()">
<script>
// LOGIC START — pure functions, checked by check.js
// [id, name, sets, repLow, repHigh, restSec, cue, unit]
const PROGRAM = {
  A: { name: 'Quads & Chest', ex: [
    ['squat', 'Barbell Back Squat', 3, 6, 10, 150, 'Sit back and down, knees track over toes, chest up.'],
    ['hipthrust', 'Barbell Hip Thrust', 3, 8, 12, 120, 'Chin tucked, pause 1s at top, squeeze glutes.'],
    ['dbbench', 'Dumbbell Bench Press', 3, 8, 12, 120, 'Shoulder blades pinched, lower to chest level.'],
    ['cablerow', 'Seated Cable Row', 3, 10, 12, 90, 'Pull elbows back, squeeze shoulder blades.'],
    ['lateral', 'Dumbbell Lateral Raise', 3, 12, 15, 60, 'Lead with elbows, stop at shoulder height.'],
    ['plank', 'Plank', 3, 30, 60, 60, 'Ribs down, squeeze glutes. Log seconds as reps.', 'sec'],
  ]},
  B: { name: 'Hamstrings & Back', ex: [
    ['rdl', 'Romanian Deadlift', 3, 8, 10, 150, 'Push hips back, soft knees, bar close to legs.'],
    ['bss', 'Bulgarian Split Squat', 3, 8, 12, 90, 'Per leg. Lean slightly forward for more glute.'],
    ['pulldown', 'Lat Pulldown', 3, 8, 12, 90, 'Pull bar to upper chest, elbows down and back.'],
    ['dbpress', 'Seated Dumbbell Shoulder Press', 3, 8, 12, 120, 'Press up and slightly in, don\'t arch your back.'],
    ['kickback', 'Cable Glute Kickback', 2, 12, 15, 60, 'Per leg. Kick back and up, don\'t swing.'],
    ['cablecrunch', 'Cable Crunch', 3, 10, 15, 60, 'Curl ribs to hips. Don\'t just bend at the hips.'],
  ]},
  C: { name: 'Glutes & Shoulders', ex: [
    ['legpress', 'Leg Press', 3, 10, 12, 120, 'Feet high and wide for more glute work.'],
    ['legcurl', 'Lying Leg Curl', 3, 10, 12, 90, 'Control the lowering, 2–3 seconds.'],
    ['abductor', 'Hip Abduction Machine', 3, 12, 20, 60, 'Lean forward slightly to hit upper glutes.'],
    ['inclinedb', 'Incline Dumbbell Press', 3, 8, 12, 120, 'Bench at about 30°.'],
    ['dbrow', 'One-Arm Dumbbell Row', 3, 8, 12, 90, 'Per arm. Pull to your hip, not your chest.'],
    ['facepull', 'Face Pull', 3, 12, 15, 60, 'Rope to forehead, thumbs back. Good for posture.'],
    ['kneeraise', 'Hanging Knee Raise', 3, 10, 15, 60, 'Curl pelvis up, no swinging. Log 0 kg.'],
  ]},
};
const ex = ([id, name, sets, lo, hi, rest, cue, unit = 'reps']) => ({ id, name, sets, lo, hi, rest, cue, unit });

// A session is { date: 'YYYY-MM-DD', day: 'A', sets: { exId: [[kg, reps], ...] } }
function lastSets(log, id) {
  for (let i = log.length - 1; i >= 0; i--) if (log[i].sets[id]?.length) return log[i].sets[id];
  return null;
}
// Best set = heaviest weight; ties go to more reps.
function bestSet(log, id) {
  let best = null;
  for (const s of log) for (const [kg, reps] of s.sets[id] || [])
    if (!best || kg > best[0] || (kg === best[0] && reps > best[1])) best = [kg, reps];
  return best;
}
// Double progression: hit the top of the rep range on every set → add weight.
function advice(e, last) {
  if (!last) return e.unit === 'sec'
    ? `First time: hold as long as you can with good form, up to ${e.hi}s.`
    : `First time: pick a weight you could lift for ${e.hi + 2} reps, do ${e.hi}.`;
  if (last.length >= e.sets && last.every(([, r]) => r >= e.hi))
    return e.unit === 'sec' || last[0][0] === 0
      ? `You maxed it out last time. Add weight or slow it down.`
      : `You hit ${e.hi} on every set. Go up one weight step today and aim for ${e.lo}+.`;
  return `Same weight as last time, try to get at least 1 more rep.`;
}
function nextDay(log) {
  const days = Object.keys(PROGRAM);
  return log.length ? days[(days.indexOf(log[log.length - 1].day) + 1) % days.length] : 'A';
}
function newPRs(log, session) {
  const out = [];
  for (const [id, sets] of Object.entries(session.sets)) {
    const old = bestSet(log, id), now = bestSet([session], id);
    if (old && (now[0] > old[0] || (now[0] === old[0] && now[1] > old[1]))) out.push([id, now]);
  }
  return out;
}
function validLog(data) {
  return Array.isArray(data) && data.every(s => s && typeof s.date === 'string' && s.day in PROGRAM &&
    s.sets && typeof s.sets === 'object' &&
    Object.values(s.sets).every(a => Array.isArray(a) && a.every(p => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite))));
}

// Progress photos. Check-ins are { date, front: Blob|null, side: Blob|null } in IndexedDB,
// since photos are far too big for localStorage. They never leave the phone except in an export.
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('recomp', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('checkins', { keyPath: 'date' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function idb(mode, fn) {
  const tx = (await dbp).transaction('checkins', mode), req = fn(tx.objectStore('checkins'));
  return new Promise((res, rej) => { tx.oncomplete = () => res(req?.result); tx.onerror = () => rej(tx.error); });
}
let checks = []; // oldest first
async function loadChecks() {
  try { checks = (await idb('readonly', s => s.getAll())).sort((a, b) => a.date.localeCompare(b.date)); }
  catch { toast("Photos can't be saved in this browser mode"); }
  if (tab === 'progress') render();
}
// ponytail: object URLs are never revoked; a few dozen photos per session is fine.
const urls = new Map();
const src = b => { if (!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b); };
const photo = (b, label) => b ? `<img src="${src(b)}" alt="${label}">` : `<div class="ph">No ${label.toLowerCase()} photo</div>`;
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const EVERY = 28; // days between check-ins: weekly photos change too little to see

// Phone photos are 3–5 MB; 1600px JPEG keeps detail for comparing at a tenth of the size.
async function shrink(file) {
  const img = new Image(); img.src = URL.createObjectURL(file); await img.decode();
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

    ${checks.length ? checks.slice().reverse().map(c => `
      <h3>${nice(c.date, { month: 'long', day: 'numeric', year: 'numeric' })}${c !== first ? ` · week ${Math.floor(daysBetween(first.date, c.date) / 7)}` : ' · start'}</h3>
      <button class="group check" onclick="editCheck('${c.date}')" aria-label="Edit check-in ${c.date}">
        <div class="pair">${photo(c.front, 'Front')}${photo(c.side, 'Side')}</div>
      </button>`).join('')
    : `<div class="card empty" style="margin-top:24px"><p>No photos yet</p><p class="sub">Add a front and side photo today. In a few weeks you'll be glad you did.</p></div>`}`;
}

function newCheck() { edit = { date: today(), front: null, side: null, isNew: true }; pv = 'edit'; render(); scrollTo(0, 0); }
function editCheck(d) { edit = { ...checks.find(c => c.date === d), isNew: false }; pv = 'edit'; render(); scrollTo(0, 0); }
function editView() {
  const slot = (k, label) => `<button class="slot" onclick="photoFile.dataset.k = '${k}'; photoFile.click()" aria-label="${edit[k] ? 'Replace' : 'Add'} ${label.toLowerCase()} photo">
    ${edit[k] ? `<img src="${src(edit[k])}" alt="${label}"><span class="cap">${label} · tap to replace</span>` : `<div class="ph add">${ICON.camera}<span>Add ${label.toLowerCase()} photo</span></div>`}</button>`;
  return `
    <div class="top">${back}<h1>${edit.isNew ? 'New check-in' : nice(edit.date, { month: 'long', day: 'numeric', year: 'numeric' })}</h1></div>
    ${edit.isNew ? `<h3>Date</h3><input type="date" value="${edit.date}" max="${today()}" onchange="edit.date = this.value || today()" aria-label="Check-in date">` : ''}
    <h3>Photos</h3>
    <div class="pair edit">${slot('front', 'Front')}${slot('side', 'Side')}</div>
    <p class="note">⚠ Same time of day, same spot, same lighting as last time.</p>
    <button class="primary" style="margin-top:24px" onclick="saveCheck()" ${edit.front || edit.side ? '' : 'disabled'}>Save check-in</button>
    ${edit.isNew ? '' : `<button class="link danger" style="margin-top:8px" onclick="deleteCheck()">Delete check-in</button>`}`;
}
async function pickedPhoto() {
  const f = photoFile.files[0], k = photoFile.dataset.k; photoFile.value = '';
  if (!f || !edit) return;
  try { edit[k] = await shrink(f); } catch { return toast("Couldn't read that photo"); }
  render();
}
async function saveCheck() {
  const { date, front, side, isNew } = edit;
  if (isNew && checks.some(c => c.date === date) && !confirm(`Replace the ${nice(date)} check-in?`)) return;
  try { await idb('readwrite', s => s.put({ date, front, side })); } catch { return toast("Couldn't save. Is storage full?"); }
  navigator.storage?.persist?.(); // ask iOS not to clear photos when space runs low
  pv = 'list'; edit = null; await loadChecks(); render(); scrollTo(0, 0); toast('Check-in saved');
}
async function deleteCheck() {
  if (!confirm(`Delete the ${nice(edit.date)} photos? This can't be undone.`)) return;
  await idb('readwrite', s => s.delete(edit.date));
  pv = 'list'; edit = null; await loadChecks(); render();
}

function openCompare() {
  const has = d => checks.some(c => c.date === d);
  if (!has(cmp.a)) cmp.a = checks[0].date;
  if (!has(cmp.b)) cmp.b = checks.at(-1).date;
  pv = 'compare'; render(); scrollTo(0, 0);
}
function compareView() {
  const pick = k => `<select onchange="cmp.${k} = this.value; render()" aria-label="${k === 'a' ? 'Before' : 'After'} date">${checks.map(c =>
    `<option value="${c.date}" ${c.date === cmp[k] ? 'selected' : ''}>${nice(c.date, { month: 'short', day: 'numeric', year: '2-digit' })}</option>`).join('')}</select>`;
  const at = d => checks.find(c => c.date === d), label = cmp.side === 'front' ? 'Front' : 'Side';
  const gap = Math.abs(daysBetween(cmp.a, cmp.b));
  return `
    <div class="top">${back}<h1>Compare</h1></div>
    <div class="seg" role="group" aria-label="Photo angle">${['front', 'side'].map(k =>
      `<button aria-pressed="${cmp.side === k}" onclick="cmp.side = '${k}'; render()">${k === 'front' ? 'Front' : 'Side'}</button>`).join('')}</div>
    <div class="cmp">
      <div>${pick('a')}${photo(at(cmp.a)[cmp.side], label)}</div>
      <div>${pick('b')}${photo(at(cmp.b)[cmp.side], label)}</div>
    </div>
    <p class="note" style="text-align:center">${gap ? `${gap >= 14 ? `${Math.round(gap / 7)} weeks` : `${gap} day${gap > 1 ? 's' : ''}`} apart` : 'Same check-in on both sides'}</p>`;
}
const toDataURL = b => b && new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

function start(day) {
  const draft = load('draft', null);
  if (!draft || draft.day !== day) save('draft', { day, sets: {}, done: {}, started: Date.now() });
  open = null;
  workout();
  scrollTo(0, 0);
}

// What a set logs if left as-is: typed value, else (kg) this workout's previous set, else last session.
function fill(e, d, last, i, f) {
  const t = d[i]?.[f];
  if (t != null && t !== '') return t;
  if (f === 1) return last?.[i]?.[1] ?? last?.[0]?.[1] ?? '';
  return i > 0 ? fill(e, d, last, i - 1, 0) : last?.[0]?.[0] ?? (e.unit === 'sec' ? 0 : '');
}
const doneCount = (draft, e) => Math.min(e.sets, (draft.done?.[e.id] || []).filter(Boolean).length);

function card(e, draft) {
  const last = lastSets(log, e.id), best = bestSet(log, e.id), d = draft.sets[e.id] || [], done = draft.done?.[e.id] || [];
  const ph = (i, f) => { const v = fill(e, d, last, i, f); return v === '' ? (f ? e.unit : 'kg') : v; };
  return `<section class="card ex-open ${e.id !== shown ? 'enter' : ''}">
    <h2>${e.name}</h2>
    <p class="sub meta">${e.sets} × ${e.lo}–${e.hi} ${e.unit} · rest ${mmss(e.rest)}</p>
    <p class="sub cue">${e.cue}</p>
    <div class="stats">
      <div><span class="sub">Last time</span><b>${fmt(last, e)}</b></div>
      <div><span class="sub">Best ever</span><b>${fmtSet(best, e)}</b></div>
    </div>
    <p class="tip">${ICON.up}<span>${advice(e, last)}</span></p>
    <div class="sets">
      <div class="head"><span>Set</span><span>kg</span><span>${e.unit}</span><span></span></div>
      ${Array.from({ length: e.sets }, (_, i) => `
      <div class="set ${done[i] ? 'done' : ''} ${popped === `${e.id}:${i}` ? 'pop' : ''}">
        <span class="n">${i + 1}</span>
        <input class="num" type="text" inputmode="decimal" autocomplete="off" data-ex="${e.id}" data-i="${i}" data-f="0" value="${d[i]?.[0] ?? ''}" placeholder="${ph(i, 0)}" aria-label="Set ${i + 1} kg">
        <input type="number" inputmode="numeric" min="0" data-ex="${e.id}" data-i="${i}" data-f="1" value="${d[i]?.[1] ?? ''}" placeholder="${ph(i, 1)}" aria-label="Set ${i + 1} ${e.unit}">
        <button class="tick" onclick="tick('${e.id}', ${i})" aria-pressed="${!!done[i]}" aria-label="Set ${i + 1} done">${ICON.check}</button>
      </div>`).join('')}
    </div>
  </section>`;
}

function row(e, draft) {
  const n = doneCount(draft, e), ok = n >= e.sets;
  return `<button class="ex-row ${ok ? 'ok' : ''}" onclick="openEx('${e.id}')">
    <span class="dot">${ok ? ICON.check : ''}</span>
    <span class="grow">${e.name}</span>
    <span class="sub">${ok ? fmt(logged(e, draft), e) : n ? `${n} of ${e.sets} sets` : `${e.sets} × ${e.lo}–${e.hi}`}</span>
  </button>`;
}

function workout() {
  const draft = load('draft', null), day = PROGRAM[draft.day], list = day.ex.map(ex);
  if (!list.some(e => e.id === open)) open = (list.find(e => doneCount(draft, e) < e.sets) || list[0]).id;
  const total = list.reduce((n, e) => n + e.sets, 0), n = list.reduce((n, e) => n + doneCount(draft, e), 0);
  app.innerHTML = `
    <header class="nav">
      <div class="row"><button class="link" onclick="cancel()">Cancel</button><span class="title">Full body</span><span class="count">${n} / ${total} sets</span></div>
      <div class="progress"><i style="width:${n / total * 100}%"></i></div>
    </header>
    <h1>${day.name}</h1>
    ${list.map(e => e.id === open ? card(e, draft) : row(e, draft)).join('')}`;
  shown = open; popped = null;
  cta.innerHTML = `<button class="primary" onclick="finish()">Finish workout</button>`;
  $('tabs').hidden = true;
}

function openEx(id) {
  open = id; workout();
  document.querySelector('.ex-open').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Save every keystroke to the draft so closing the app mid-workout loses nothing.
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.me) return meInput(t);
  if (!t.dataset.ex) return;
  if (t.dataset.f === '0') { const v = cleanNum(t.value); if (v !== t.value) t.value = v; }
  const draft = load('draft', null);
  const sets = draft.sets[t.dataset.ex] ||= [];
  const row = sets[t.dataset.i] ||= ['', ''];
  row[t.dataset.f] = t.value;
  save('draft', draft);
  // A new weight on set 1 flows down to the later sets' placeholders.
  const e = EX[t.dataset.ex], last = lastSets(log, e.id);
  app.querySelectorAll(`input[data-ex="${e.id}"][data-f="0"]`).forEach(inp => inp.placeholder = fill(e, sets, last, +inp.dataset.i, 0) || 'kg');
});

function tick(id, i) {
  const draft = load('draft', null), e = EX[id], last = lastSets(log, id);
  const d = draft.sets[id] ||= [], done = (draft.done ||= {})[id] ||= [];
  if (!done[i]) {
    const vals = [fill(e, d, last, i, 0), fill(e, d, last, i, 1)];
    const miss = vals.findIndex(v => v === '' || !Number.isFinite(+v));
    if (miss >= 0) {
      const inp = app.querySelector(`input[data-ex="${id}"][data-i="${i}"][data-f="${miss}"]`);
      inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 400); inp.focus();
      return toast(miss ? `Enter ${e.unit} for set ${i + 1}` : `Enter the weight for set ${i + 1}`);
    }
    d[i] = vals.map(String); // freeze what was logged so it shows as a real value
  }
  done[i] = !done[i];
  save('draft', draft);
  if (done[i]) {
    popped = `${id}:${i}`;
    startRest(e.rest);
    if (doneCount(draft, e) >= e.sets) { // exercise complete → open the next unfinished one
      const list = PROGRAM[draft.day].ex.map(ex), k = list.findIndex(x => x.id === id);
      open = [...list.slice(k + 1), ...list.slice(0, k)].find(x => doneCount(draft, x) < x.sets)?.id ?? id;
    }
  }
  workout();
  if (open !== id) document.querySelector('.ex-open').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Sets that count: checked ones, plus any with reps typed but not checked (older drafts, or a forgotten ✓).
function logged(e, draft) {
  const d = draft.sets[e.id] || [], last = lastSets(log, e.id), done = draft.done?.[e.id] || [], out = [];
  for (let i = 0; i < e.sets; i++) if (done[i] || (d[i]?.[1] ?? '') !== '') {
    const reps = fill(e, d, last, i, 1);
    if (reps !== '') out.push([+fill(e, d, last, i, 0) || 0, Number(reps)]);
  }
  return out;
}

// Rest timer: wall-clock based, so it stays right after the phone sleeps.
let rest = null;
function startRest(sec) {
  rest = { end: Date.now() + sec * 1000, total: sec };
  $('timer').classList.remove('over'); $('tlabel').textContent = 'Rest';
  tickRest();
}
function addRest(s) { if (!rest) return; if (rest.over) startRest(s); else { rest.end += s * 1000; rest.total += s; tickRest(); } }
function skipRest() { rest = null; tickRest(); }
function tickRest() {
  $('timer').hidden = !rest;
  if (!rest) return;
  const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
  $('ttime').textContent = mmss(left);
  $('tfill').style.width = `${left / rest.total * 100}%`;
  if (left || rest.over) return;
  rest.over = true;
  $('timer').classList.add('over'); $('tlabel').textContent = 'Time for your next set';
  navigator.vibrate?.([200, 100, 200]);
  const r = rest; setTimeout(() => rest === r && skipRest(), 5000);
}
setInterval(tickRest, 250);

function finish() {
  const draft = load('draft', null);
  const session = { date: today(), day: draft.day, sets: {} };
  for (const e of PROGRAM[draft.day].ex.map(ex)) {
    const done = logged(e, draft);
    if (done.length) session.sets[e.id] = done;
  }
  const n = Object.values(session.sets).flat().length;
  if (!n) return toast('Tap ✓ on at least one set first');
  const total = PROGRAM[draft.day].ex.reduce((t, e) => t + e[2], 0);
  if (n < total && !confirm(`${total - n} sets aren't done. Finish anyway?`)) return;
  // Clock time if it looks real (app left open overnight doesn't), else sets × (rest + ~40s of work).
  const mins = draft.started && Math.round((Date.now() - draft.started) / 60000);
  const est = Object.entries(session.sets).reduce((t, [id, s]) => t + s.length * (EX[id].rest + 40), 0) / 60;
  const kcal = kcalBurned(me, mins > 0 && mins < 300 ? mins : est);
  if (kcal) session.kcal = kcal;
  const prs = newPRs(log, session);
  log.push(session); save('log', log); localStorage.removeItem('draft');
  delete plan[session.date]; save('plan', plan); sel = today(); month = sel.slice(0, 7);
  skipRest(); open = null;
  summary(session, prs, mins);
}

// The end of the workout is the moment to remember: celebrate it, then point to what's next.
function summary(s, prs, mins) {
  const next = suggested();
  app.innerHTML = `<div class="finish">
    <div class="badge">${ICON.big}</div>
    <h1>Workout done</h1>
    <p class="sub">Full body · ${PROGRAM[s.day].name}</p>
    <div class="tiles">
      <div class="tile"><b>${Object.values(s.sets).flat().length}</b><span>Sets</span></div>
      <div class="tile"><b>${Math.round(volume(s)).toLocaleString()}</b><span>kg lifted</span></div>
      ${mins > 0 && mins < 300 ? `<div class="tile"><b>${mins}</b><span>Minutes</span></div>` : ''}
      ${s.kcal ? `<div class="tile"><b>${s.kcal}</b><span>kcal burned (est.)</span></div>` : ''}
    </div>
    ${s.kcal ? '' : `<p class="note">Add your stats in Settings to see calories burned.</p>`}
    ${prs.length ? `<h3>New personal bests</h3><div class="group">${prs.map(([id, b]) =>
      `<div class="li"><span>🏆</span><span class="grow">${EX[id].name}</span><b>${fmtSet(b, EX[id])}</b></div>`).join('')}</div>` : ''}
    <p class="cheer">${prs.length ? 'You got stronger today.' : 'You showed up. That\'s what builds results.'}<br>
      Next up: ${PROGRAM[next].name}, after a rest day.</p>
  </div>`;
  $('tabs').hidden = true;
  cta.innerHTML = `<button class="primary" onclick="setTab('home')">Done</button>`;
  scrollTo(0, 0);
}

function cancel() {
  if (confirm('Discard this workout? Sets you logged today will be lost.')) { localStorage.removeItem('draft'); skipRest(); open = null; setTab('home'); }
}

function del(i) {
  if (confirm(`Delete the ${log[i].date} session?`)) { log.splice(i, 1); save('log', log); render(); }
}

async function exportLog() {
  const photos = await Promise.all(checks.map(async c => ({ date: c.date, front: await toDataURL(c.front), side: await toDataURL(c.side) })));
  const file = new File([JSON.stringify({ log, plan, photos, me })], `recomp-backup-${today()}.json`, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) return navigator.share({ files: [file] }).catch(() => {});
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: file.name });
  a.click();
}

importFile.addEventListener('change', async () => {
  const f = importFile.files[0]; importFile.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { return toast('That file is not valid JSON'); }
  const newLog = Array.isArray(data) ? data : data?.log; // older backups are just the log array
  if (!validLog(newLog)) return toast('That file is not a Recomp backup');
  const isPic = x => x == null || (typeof x === 'string' && x.startsWith('data:image/'));
  const photos = Array.isArray(data.photos) ? data.photos.filter(p => p && typeof p.date === 'string' && isPic(p.front) && isPic(p.side)) : null;
  const what = (n, m) => `${n} sessions${photos ? ` and ${m} photo check-ins` : ''}`;
  if (!confirm(`Replace your ${what(log.length, checks.length)} with ${what(newLog.length, photos?.length)} from the backup?`)) return;
  log = newLog; save('log', log);
  if (data.plan && typeof data.plan === 'object') { plan = Object.fromEntries(Object.entries(data.plan).filter(([, k]) => Object.hasOwn(PROGRAM, k))); save('plan', plan); }
  if (data.me && typeof data.me === 'object') { me = data.me; save('me', me); }
  if (photos) {
    const blob = u => u && fetch(u).then(r => r.blob());
    const recs = await Promise.all(photos.map(async p => ({ date: p.date, front: await blob(p.front), side: await blob(p.side) })));
    try { await idb('readwrite', st => { st.clear(); recs.forEach(r => st.put(r)); }); } catch { toast("Workouts restored, but photos couldn't be saved"); }
    await loadChecks();
  }
  render(); toast('Backup restored');
});

load('draft', null) ? workout() : render();
loadChecks();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
